# Cluster Toolkit blueprint: a small GPU Slurm cluster on Google Cloud.
# Modeled on the toolkit's examples/hpc-slurm.yaml and its GPU blueprints.
# Module paths and settings change between toolkit releases,
# so compare against the examples/ folder in the version you install.

blueprint_name: hpc-slurm

vars:
  project_id: my-gcp-project      # <-- your GCP project ID
  deployment_name: hpc-slurm      # name for this deployment (folder + resource prefix)
  region: us-central1
  zone: us-central1-a             # must offer G2 / NVIDIA L4 (us-central1-a does)
  # One image for every VM (controller, login and GPU nodes), as Google's GPU
  # blueprints do: Ubuntu 24.04 + Slurm 26.05 + NVIDIA driver 595 + CUDA 13.2.
  instance_image:
    project: advanced-compute-images
    family: aci-gpu-u2404-slurm-2605-cuda-132-nvidia-595-amd64

deployment_groups:
- group: primary
  modules:

  # 1. Network: a VPC for the cluster
  - id: network
    source: modules/network/vpc

  # 2. Shared storage: a Filestore share mounted as /home on every node
  #    BASIC_HDD at 1 TiB (its minimum) keeps test clusters cheap.
  #    For faster I/O use BASIC_SSD, whose minimum size is 2560 GiB.
  - id: homefs
    source: modules/file-system/filestore
    use: [network]
    settings:
      local_mount: /home
      filestore_tier: BASIC_HDD
      size_gb: 1024

  # 3. GPU nodes: up to 2 g2-standard-4 VMs, each with 1 NVIDIA L4 GPU,
  #    created only when jobs need them.
  #    G2 machines come with their GPU attached, so no guest_accelerator setting is needed.
  #    Needs NVIDIA L4 GPU quota in the region.
  - id: gpu_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      machine_type: g2-standard-4
      node_count_dynamic_max: 2    # autoscale from 0 up to 2 nodes
      disk_type: pd-balanced
      disk_size_gb: 100            # GPU image with CUDA needs more room than the 50 GB default
      allow_automatic_updates: false

  # 4. GPU partition: the only (and default) queue. Request the GPU with `--gpus=1`.
  #    exclusive: false lets nodes stay up briefly between jobs instead of being
  #    deleted right after each one, so back-to-back GPU jobs start faster.
  - id: gpu_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use: [gpu_nodeset]
    settings:
      partition_name: gpu
      is_default: true
      exclusive: false

  # 5. Login node: where users SSH in and run sbatch/srun
  #    No public IP: SSH goes through IAP, and Cloud NAT handles outbound traffic.
  - id: slurm_login
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    use: [network]
    settings:
      machine_type: n2-standard-4
      disk_size_gb: 100            # room for the GPU image
      enable_login_public_ips: false

  # 6. Controller: the Slurm "head chef" that ties everything together
  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use: [network, gpu_partition, homefs, slurm_login]
    settings:
      disk_size_gb: 100            # room for the GPU image
      enable_controller_public_ips: false

# Usage (from the cluster-toolkit folder, after `make`):
#   ./gcluster create hpc-slurm.yaml --vars project_id=my-gcp-project
#   ./gcluster deploy hpc-slurm      # runs terraform init/plan/apply for you
#   gcloud compute ssh <login-vm-name> --zone us-central1-a --tunnel-through-iap
#   srun --gpus=1 nvidia-smi         # test: should list one NVIDIA L4
#   ./gcluster destroy hpc-slurm     # tears everything down
